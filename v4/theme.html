<table cellpadding="0" cellspacing="0" width="500" bgcolor="#000000" style="font-family:Inter,Arial,sans-serif;background:#000000;">
  <tbody>
    <tr>
      <td width="200" valign="middle" bgcolor="#000000" style="padding:0 0 0 29px;background:#000000;white-space:nowrap;">
        <div style="font-size:20px;line-height:24px;font-weight:500;color:#fafafa;letter-spacing:-0.3px;">{{nome}}</div>
        {{#cargo}}<div style="margin-top:3px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.5px;color:#ff5e2c;">{{cargo}}</div>{{/cargo}}
        <div style="margin-top:12px;font-size:10px;line-height:15px;letter-spacing:0.4px;color:#fafafa;">
          <span style="font-size:7px;font-weight:500;letter-spacing:0.7px;color:#a8a29e;">TEL</span>&nbsp; {{empresa.telefoneRP}}&nbsp;&nbsp;&nbsp;&nbsp;{{empresa.telefoneSP}}<br>
          <span style="font-size:7px;font-weight:500;letter-spacing:0.7px;color:#a8a29e;">WEB</span>&nbsp; <a href="{{empresa.site}}" target="_blank" style="color:#fafafa;text-decoration:none;">{{empresa.siteLabel}}</a>
        </div>
      </td>
      <td width="300" valign="bottom" bgcolor="#000000" style="background:#000000;line-height:0;font-size:0;">
        <a href="{{empresa.site}}" target="_blank"><img src="{{cdn}}/v4/logo.png" width="300" height="130" alt="Convertize" style="border:0;display:block;"></a>
      </td>
    </tr>
  </tbody>
</table>
