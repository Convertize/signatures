<table cellpadding="0" cellspacing="0" border="0" width="400" bgcolor="#ffeded" style="width:400px;border-collapse:separate;border:1px dashed #e7b3c0;border-radius:8px;font-family:'Century Gothic',CenturyGothic,Tahoma,Verdana,Arial,sans-serif;background:#ffeded;">
  <tbody>
    <tr>
      <td width="170" valign="middle" style="width:152px;padding:18px 0 0 18px;vertical-align:middle;">
        <img src="{{cdn}}/mixlarv1/logo.png" width="110" height="31" alt="Mix Lar" border="0" style="border:0;display:block;width:110px;height:31px;">
      </td>
      <td width="230" valign="middle" align="center" style="width:212px;padding:18px 18px 0 0;vertical-align:middle;text-align:center;">
        <table cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;margin:0 auto;">
          <tbody>
            <tr>
              <td align="center" style="text-align:center;white-space:nowrap;">
                <div style="font-size:18px;line-height:22px;color:#b0124f;">{{nome}}</div>
                {{#cargo}}<div style="margin-top:2px;font-size:13px;line-height:17px;color:#555555;">{{cargo}}</div>{{/cargo}}
                {{#email}}<div style="margin-top:2px;font-size:11px;line-height:15px;"><a href="mailto:{{email}}" style="color:#444444;text-decoration:none;">{{email}}</a></div>{{/email}}
                {{#celular}}<div style="margin-top:2px;font-size:11px;line-height:15px;color:#444444;"><span style="color:#d0213c;">Cel:</span> {{celular}}</div>{{/celular}}
                {{#ramal}}<div style="margin-top:2px;font-size:11px;line-height:15px;color:#444444;"><span style="color:#d0213c;">Ramal:</span> {{ramal}}</div>{{/ramal}}
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
    <tr>
      <td width="170" valign="middle" style="width:152px;padding:14px 0 16px 18px;vertical-align:middle;">
        {{#telefone}}<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
          <tbody>
            <tr>
              <td width="18" valign="middle" style="width:18px;vertical-align:middle;line-height:0;font-size:0;"><img src="{{cdn}}/mixlarv1/phone.png" width="14" height="14" alt="" border="0" style="border:0;display:block;width:14px;height:14px;"></td>
              <td valign="middle" style="vertical-align:middle;font-size:11px;line-height:14px;color:#444444;white-space:nowrap;"><span style="color:#d0213c;">Fone:</span> {{telefone}}</td>
            </tr>
          </tbody>
        </table>{{/telefone}}
      </td>
      <td width="230" valign="middle" style="width:212px;padding:14px 18px 16px 0;vertical-align:middle;">
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
          <tbody>
            <tr>
              <td width="18" valign="middle" style="width:18px;vertical-align:middle;line-height:0;font-size:0;"><img src="{{cdn}}/mixlarv1/site.png" width="14" height="14" alt="" border="0" style="border:0;display:block;width:14px;height:14px;"></td>
              <td valign="middle" style="vertical-align:middle;font-size:11px;line-height:14px;color:#444444;white-space:nowrap;"><span style="color:#d0213c;">Visite o site:</span> <a href="https://www.mixlar.com.br/" target="_blank" style="color:#444444;text-decoration:none;">www.mixlar.com.br</a></td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
